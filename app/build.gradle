plugins {
    id 'com.android.application'
}

android {

    namespace 'com.example.physicsmate'
    compileSdk 34
    packagingOptions {
        resources {
            excludes += ['graphml.xsd', 'xlink.xsd', 'viz.xsd', 'gexf.xsd', 'META-INF/DEPENDENCIES', 'META-INF/org/apache/logging/log4j/core/config/plugins/Log4j2Plugins.dat']
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    defaultConfig {
        applicationId "com.example.physicsmate"
        resConfig("en")
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "10.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
    }

    buildTypes {
        release {

            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        debug {
            minifyEnabled false
            shrinkResources false
            //proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

    }

    buildFeatures{
        dataBinding = true
        viewBinding = true
    }

    dataBinding {
        enabled = true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

}

configurations.configureEach {
    config -> {
        exclude group:"org.apache.logging.log4j", module:"log4j-core"
    }
        resolutionStrategy {
            force "org.apache.logging.log4j:log4j-api:2.17.2"
        }
}

configurations.implementation {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
}

repositories
        {
            google()
            mavenCentral()
            jcenter()
            maven { url 'https://jitpack.io' }
            maven { url "https://andob.io/repository/open_source" }
        }

