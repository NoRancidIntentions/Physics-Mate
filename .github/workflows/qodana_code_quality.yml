name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          pr-mode: false
          args: --apply-fixes
          push-fixes: pull-request
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2023.2
        env:
          QODANA_TOKEN: ${{ secrets.eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJvcmdhbml6YXRpb24iOiIzb1paYSIsInByb2plY3QiOiIzSk5XUCIsInRva2VuIjoiQUdRbFoifQ.YbOR3kcJCTlPgLybolMkj-pN9uOHYnUrS-TBFJcOsFI }}